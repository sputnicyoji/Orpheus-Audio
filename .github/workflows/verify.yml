name: Public Package
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate
        shell: pwsh
        run: pwsh -NoProfile -File ./.github/scripts/test-public-package.ps1
      - name: Validate UPM tarball
        shell: pwsh
        run: pwsh -NoProfile -File ./.github/scripts/test-public-tarball.ps1
